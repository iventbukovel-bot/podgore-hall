<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podgore Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="login"><img src="logo.png"><h1>Адмін-панель подій</h1><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Увійти</button><small>Стартовий пароль: podgore-admin</small><p id="loginError"></p></div>
<div id="dashboard" class="dashboard hidden"><aside><img src="logo.png"><nav><button class="navbtn active" data-tab="content">Контент і ціни</button><button class="navbtn" data-tab="photos">Фотографії</button><button class="navbtn" data-tab="leads">Заявки</button></nav><a href="index.html" target="_blank">Відкрити сайт ↗</a></aside><main>
<header><div><p>HOTEL PODGORE</p><h1>Керування сторінкою</h1></div><button id="save">Зберегти зміни</button></header>
<section id="content" class="tab"><div class="card"><h2>Пакети та ціни</h2><div id="packageEditor"></div></div><div class="card"><h2>Додаткові послуги</h2><div id="extrasEditor"></div></div><div class="card"><h2>Формати подій</h2><div id="eventsEditor"></div></div></section>
<section id="photos" class="tab hidden"><div class="card"><h2>Головне фото</h2><input type="file" id="heroUpload" accept="image/*"><div id="heroPreview" class="preview"></div></div><div class="card"><h2>Галерея</h2><p>Оберіть до 6 фотографій. Вони збережуться у браузері цього пристрою.</p><input type="file" id="galleryUpload" accept="image/*" multiple><div id="galleryPreview" class="preview-grid"></div></div></section>
<section id="leads" class="tab hidden"><div class="card"><h2>Заявки</h2><div id="leadList"></div></div></section>
</main></div><script src="admin.js"></script></body></html>
